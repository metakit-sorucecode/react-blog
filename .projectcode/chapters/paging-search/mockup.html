<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>paging-search 시안</title>
  <link rel="stylesheet" href="../../../react-blog/node_modules/daisyui/daisyui.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <style>
    .shot { border: 1px dashed #999; margin: 32px auto; max-width: 52rem; }
    .shot > p { background: #eee; padding: 4px 8px; font-size: 12px; }
  </style>
</head>
<body>

<!-- 홈: 시드 글 4개, 한 페이지 3개 -->
<section class="shot"><p>홈 / (1페이지)</p>
  <div class="max-w-3xl mx-auto p-8">
    <ul class="menu menu-horizontal">
      <li><a class="menu-active" href="#">홈</a></li><li><a href="#">로그인</a></li><li><a href="#">회원가입</a></li>
    </ul>
    <hr class="mb-8">
    <input class="input w-full mb-8" placeholder="제목 검색" value="">
    <div class="grid grid-cols-3 gap-8">
      <div class="card border"><div class="card-body"><a href="#">제목4</a></div></div>
      <div class="card border"><div class="card-body"><a href="#">제목3</a></div></div>
      <div class="card border"><div class="card-body"><a href="#">제목2</a></div></div>
    </div>
    <div class="flex justify-center items-center gap-4 mt-8">
      <button class="btn" disabled>이전</button>
      <span>1 / 2</span>
      <button class="btn">다음</button>
    </div>
  </div>
</section>

<!-- 검색 결과 없음 -->
<section class="shot"><p>검색 결과 없음</p>
  <div class="max-w-3xl mx-auto p-8">
    <ul class="menu menu-horizontal">
      <li><a class="menu-active" href="#">홈</a></li><li><a href="#">로그인</a></li><li><a href="#">회원가입</a></li>
    </ul>
    <hr class="mb-8">
    <input class="input w-full mb-8" placeholder="제목 검색" value="없는글">
    <p class="text-center">검색 결과가 없습니다</p>
    <div class="flex justify-center items-center gap-4 mt-8">
      <button class="btn" disabled>이전</button>
      <span>1 / 1</span>
      <button class="btn" disabled>다음</button>
    </div>
  </div>
</section>

</body>
</html>
