<!doctype html>
<html lang="ko" data-theme="light">
<head>

  <title>error-handling 시안</title>
  <link rel="stylesheet" href="../../../react-blog/node_modules/daisyui/daisyui.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <style>
    .shot { border: 1px dashed #999; margin: 32px auto; max-width: 52rem; position: relative; }

</head>
<body>

<!-- 로딩: 홈, 상세, 글 수정, 내 정보 공통 -->
<section class="shot"><p>로딩 /board/1</p>
  <div class="max-w-3xl mx-auto p-8">
    <ul class="menu menu-horizontal">
      <li><a href="#">홈</a></li><li><a href="#">글쓰기</a></li><li><a href="#">내 정보</a></li><li><button>로그아웃</button></li><li><span>ssar님</span></li>
    </ul>
    <hr class="mb-8">
    <div class="text-center">
      <span class="loading loading-spinner loading-lg"></span>
    </div>
  </div>
</section>

<!-- 없는 글 /board/9999 -->
<section class="shot"><p>없는 글 /board/9999</p>
  <div class="max-w-3xl mx-auto p-8">
    <ul class="menu menu-horizontal">
      <li><a href="#">홈</a></li><li><a href="#">글쓰기</a></li><li><a href="#">내 정보</a></li><li><button>로그아웃</button></li><li><span>ssar님</span></li>

      <a class="btn mt-4" href="#">목록으로</a>
    </div>
  </div>
</section>

<!-- 없는 주소 /abc -->
<section class="shot"><p>없는 주소 /abc</p>
  <div class="max-w-3xl mx-auto p-8">
    <ul class="menu menu-horizontal">
      <li><a href="#">홈</a></li><li><a href="#">로그인</a></li><li><a href="#">회원가입</a></li>
    </ul>
    <hr class="mb-8">
    <div class="text-center">
      <p>페이지를 찾을 수 없습니다</p>
      <a class="btn mt-4" href="#">홈으로</a>
    </div>
  </div>
</section>

<!-- 토스트: 화면 위 오른쪽. 검정 바탕, 흰 글자, 테두리 없음 -->
<section class="shot"><p>토스트 /join-form (중복 아이디)</p>
  <div class="rounded-box bg-black text-white text-sm px-4 py-2 absolute top-8 right-4">이미 존재하는 유저네임입니다</div>
  <div class="max-w-3xl mx-auto p-8">
    <ul class="menu menu-horizontal">
      <li><a href="#">홈</a></li><li><a href="#">로그인</a></li><li><a class="menu-active" href="#">회원가입</a></li>
    </ul>
    <hr class="mb-8">
    <form class="card border max-w-sm mx-auto p-8 gap-4">
      <h1 class="text-2xl font-bold">회원가입</h1>
      <input class="input" placeholder="아이디" value="ssar">
      <input class="input" type="password" placeholder="비밀번호" value="1234">
      <input class="input" placeholder="이메일" value="ssar@nate.com">
      <button class="btn">가입하기</button>
    </form>
  </div>
